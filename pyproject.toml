[project]
name = "django-mvp-cookiecutter"
version = "0.1.0"
description = "A cookiecutter template for packages that extend django-mvp"
authors = [
    { name = "Samuel Jennings", email = "samuel.scott.jennings@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<4.0"
# Nothing at runtime. The template is data; cookiecutter reads it.
dependencies = []

[project.urls]
Homepage = "https://github.com/django-mvp/django-mvp-cookiecutter"
Repository = "https://github.com/django-mvp/django-mvp-cookiecutter"
Issues = "https://github.com/django-mvp/django-mvp-cookiecutter/issues"

[tool.uv]
# Not a distribution. This repository is cloned or read by cookiecutter, never
# installed, so there is no package to build.
package = false

[dependency-groups]
dev = [
    "cookiecutter>=2.6,<3.0",
    "pytest>=8.3,<9.0",
    "pyyaml>=6.0,<7.0",
    "ruff>=0.14,<0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]

[tool.ruff]
# The template's own tooling only. The generated package carries its own ruff
# configuration, and linting the unrendered template would only ever report on
# Jinja placeholders that are not Python yet.
#
# Pass explicit paths rather than `.`: ruff discovers the nested
# pyproject.toml while walking the tree and fails trying to parse it as TOML,
# since at rest it is still Jinja. This exclusion does not prevent that,
# because discovery happens before exclusion.
extend-exclude = ["{{cookiecutter.distribution_name}}"]
