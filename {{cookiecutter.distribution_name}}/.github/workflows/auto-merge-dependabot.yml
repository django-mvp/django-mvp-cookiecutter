name: Auto-merge Dependabot PRs

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: {% raw %}github.actor == 'dependabot[bot]'{% endraw %}
    steps:
      - name: Auto-merge Dependabot PR
        uses: django-mvp/shared/.github/actions/auto-merge-dependabot@{{ cookiecutter._shared_tag }}
        with:
          github-token: {% raw %}${{ secrets.GITHUB_TOKEN }}{% endraw %}
          pr-url: {% raw %}${{ github.event.pull_request.html_url }}{% endraw %}
