name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump level (patch | minor | major) or an explicit version like 1.2.3'
        type: string
        required: true
        default: 'patch'

permissions:
  contents: write
  pull-requests: write

jobs:
  call-prepare-release:
    uses: django-mvp/shared/.github/workflows/prepare-release.yml@{{ cookiecutter._shared_tag }}
    with:
      bump: {% raw %}${{ inputs.bump }}{% endraw %}
    secrets:
      RELEASE_TOKEN: {% raw %}${{ secrets.RELEASE_TOKEN }}{% endraw %}
